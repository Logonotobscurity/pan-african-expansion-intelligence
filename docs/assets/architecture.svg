<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Pan-African Expansion Intelligence architecture</title><desc id="desc">A five-stage flow from public signals through validation, explainable scoring, country context and human-led action, supported by optional Supabase persistence and a protected ingestion API.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#111f39"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#d8ae54"/></marker></defs>
<rect width="1280" height="470" rx="24" fill="url(#bg)"/><text x="58" y="56" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#e7bd60">SYSTEM OVERVIEW</text><text x="58" y="91" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#f8fafc">From public signal to explainable next action</text><text x="58" y="118" font-family="Arial,sans-serif" font-size="13" fill="#9cacbf">A prioritisation workflow — not an autonomous claim-verification authority.</text>
<g font-family="Arial,sans-serif"><rect x="58" y="160" width="200" height="132" rx="16" fill="#16253b" stroke="#647895" stroke-opacity=".7"/><text x="80" y="190" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">01 • INGEST</text><text x="80" y="219" font-size="18" font-weight="700" fill="#f8fafc">Signals &amp; sources</text><text x="80" y="244" font-size="12" fill="#bfccdc">Funding • launches</text><text x="80" y="262" font-size="12" fill="#bfccdc">Partnerships • hiring</text><path d="M258 225H291" stroke="#d8ae54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="160" width="200" height="132" rx="16" fill="#16253b" stroke="#647895" stroke-opacity=".7"/><text x="322" y="190" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">02 • VALIDATE</text><text x="322" y="219" font-size="18" font-weight="700" fill="#f8fafc">Evidence ledger</text><text x="322" y="244" font-size="12" fill="#bfccdc">Source and date context</text><text x="322" y="262" font-size="12" fill="#bfccdc">Signal structure checks</text><path d="M500 225H533" stroke="#d8ae54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="542" y="160" width="200" height="132" rx="16" fill="#1d2d46" stroke="#d6ad57" stroke-opacity=".9"/><text x="564" y="190" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">03 • SCORE</text><text x="564" y="219" font-size="18" font-weight="700" fill="#f8fafc">Risk &amp; relevance</text><text x="564" y="244" font-size="12" fill="#bfccdc">Evidence • intent</text><text x="564" y="262" font-size="12" fill="#bfccdc">Urgency • contactability</text><path d="M742 225H775" stroke="#d8ae54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="784" y="160" width="200" height="132" rx="16" fill="#16253b" stroke="#647895" stroke-opacity=".7"/><text x="806" y="190" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">04 • CONTEXT</text><text x="806" y="219" font-size="18" font-weight="700" fill="#f8fafc">Country radar</text><text x="806" y="244" font-size="12" fill="#bfccdc">Regulators • constraints</text><text x="806" y="262" font-size="12" fill="#bfccdc">Local partners • language</text><path d="M984 225H1017" stroke="#d8ae54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1026" y="160" width="196" height="132" rx="16" fill="#202846" stroke="#d6ad57" stroke-opacity=".9"/><text x="1048" y="190" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">05 • DECIDE</text><text x="1048" y="219" font-size="18" font-weight="700" fill="#f8fafc">Next action</text><text x="1048" y="244" font-size="12" fill="#bfccdc">Priority queue</text><text x="1048" y="262" font-size="12" fill="#bfccdc">Human-led follow-up</text>
<path d="M642 292V332" stroke="#d8ae54" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="342" width="625" height="70" rx="14" fill="#0b1728" stroke="#6f829e" stroke-opacity=".8"/><text x="352" y="368" font-size="12" font-weight="700" letter-spacing="1.3" fill="#eac66e">PERSISTENCE (OPTIONAL)</text><text x="352" y="391" font-size="14" font-weight="700" fill="#f8fafc">Supabase / PostgreSQL • country profiles • evidence • opportunities</text><path d="M400 342V314H400V292M870 342V316H870V292" stroke="#8296b2" stroke-dasharray="4 5" fill="none"/><text x="58" y="371" font-size="12" font-weight="700" fill="#a6b7cc">INGESTION API</text><text x="58" y="393" font-size="12" fill="#8698b1">Bearer-secret protected</text><text x="58" y="411" font-size="12" fill="#8698b1">POST /api/pan-african</text><text x="1220" y="444" text-anchor="end" font-size="10" letter-spacing="1.2" fill="#7488a4">EXPLAINABLE SCORES • PRIMARY-SOURCE VERIFICATION • HUMAN JUDGEMENT</text></g></svg>